[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas",
    "psycopg2-binary>=2.9.12",
    "pyspark==3.3.4",
    "python-dotenv>=1.2.3",
